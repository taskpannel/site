<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin - Task Price Control</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>body{background:#07080F;color:white}.glass{background:linear-gradient(135deg,rgba(255,255,255,0.08),rgba(255,255,255,0.03));backdrop-filter:blur(25px);border:1px solid rgba(255,255,255,0.12)}.gradient-btn{background:linear-gradient(135deg,#00D2FF,#7A5CFF,#FF3BD4)}.blur-ball{position:fixed;width:500px;height:500px;filter:blur(120px);border-radius:50%;z-index:-1;opacity:0.4}</style>
</head>
<body class="p-4 max-w-[1250px] mx-auto relative">
<div class="blur-ball bg-[#7A5CFF] top-[-10%] left-[-10%]"></div>
<div id="lock" class="min-h-[90vh] flex items-center justify-center"><div class="glass rounded-[32px] p-8 w-full max-w-[400px] text-center"><div class="w-16 h-16 gradient-btn rounded-[16px] flex items-center justify-center mx-auto text-2xl">🔐</div><h2 class="text-2xl font-bold mt-4">Admin Price Control</h2><input id="pass" type="password" placeholder="Password" class="w-full mt-6 bg-white/[0.06] border border-white/10 rounded-xl px-5 py-4 outline-none"><button onclick="login()" class="gradient-btn w-full rounded-xl py-4 font-bold mt-4">Unlock →</button></div></div>

<div id="panel" style="display:none" class="space-y-5 pb-20">
  <div class="flex justify-between items-center"><h1 class="text-2xl font-bold">Dashboard • taskup13</h1><button onclick="loadAll();loadTasks();loadPromos()" class="bg-white/10 px-5 py-2.5 rounded-full text-xs font-bold">🔄 Refresh</button></div>

  <div class="grid grid-cols-2 lg:grid-cols-4 gap-3">
    <div class="glass rounded-2xl p-5"><p class="text-white/40 text-[10px]">USERS</p><h2 class="text-3xl font-bold" id="totalUsers">0</h2></div>
    <div class="glass rounded-2xl p-5"><p class="text-white/40 text-[10px]">PENDING</p><h2 class="text-3xl font-bold" id="totalW">0</h2></div>
    <div class="glass rounded-2xl p-5"><p class="text-white/40 text-[10px]">PAID</p><h2 class="text-2xl font-bold">Rs <span id="totalPaid">0</span></h2></div>
    <div class="glass rounded-2xl p-5 border border-[#00D2FF]/30"><p class="text-white/40 text-[10px]">TASKS</p><h2 class="text-3xl font-bold text-[#00D2FF]" id="totalTasks">0</h2><p class="text-[10px] text-white/30 mt-1">Price Editable ✅</p></div>
  </div>

  <!-- TASK MANAGER WITH PRICE EDIT - ULTRA -->
  <div class="glass rounded-[24px] p-6 border border-[#00D2FF]/40">
    <div class="flex justify-between items-start gap-3"><div><h3 class="font-bold text-[17px]">🔥 Task Manager - Price & Link Control</h3><p class="text-white/40 text-xs mt-1">Task ki price, naam, link sab yahan se change karo - User app pe live update</p></div><span class="bg-[#00D2FF]/20 text-[#00D2FF] border border-[#00D2FF]/20 px-3 py-1 rounded-full text-[10px] font-bold shrink-0">LIVE EDIT</span></div>

    <div class="grid md:grid-cols-5 gap-3 mt-6 bg-black/20 p-4 rounded-2xl border border-white/5">
      <input id="taskName" placeholder="Task Name" class="bg-black/40 border border-white/10 rounded-xl px-4 py-3.5 text-sm outline-none focus:border-[#00D2FF] md:col-span-2">
      <input id="taskReward" type="number" placeholder="Price Rs" class="bg-black/40 border border-white/10 rounded-xl px-4 py-3.5 text-sm outline-none focus:border-[#00FF88] font-bold">
      <input id="taskLink" placeholder="https:// link" class="bg-black/40 border border-white/10 rounded-xl px-4 py-3.5 text-sm outline-none focus:border-white/20">
      <div class="flex gap-2"><input id="taskIcon" placeholder="✈️" class="w-[65px] bg-black/40 border border-white/10 rounded-xl px-2 py-3.5 text-sm text-center"><button onclick="createTask()" class="flex-1 bg-[#00D2FF] text-black rounded-xl py-3.5 font-bold text-sm hover:bg-[#00c0eb]">+ Add</button></div>
    </div>

    <div id="taskList" class="mt-6 space-y-3"></div>
  </div>

  <div class="glass rounded-[24px] p-6 border border-[#FF3BD4]/30">
    <h3 class="font-bold">🎁 Promo Codes</h3>
    <div class="grid md:grid-cols-4 gap-3 mt-4">
      <input id="promoCode" placeholder="CODE" class="bg-black/40 border border-white/10 rounded-xl px-4 py-3.5 text-sm uppercase">
      <input id="promoReward" type="number" placeholder="Reward Rs" class="bg-black/40 border border-white/10 rounded-xl px-4 py-3.5 text-sm">
      <input id="promoMax" type="number" placeholder="Max Uses" class="bg-black/40 border border-white/10 rounded-xl px-4 py-3.5 text-sm">
      <button onclick="createPromo()" class="bg-[#FF3BD4] rounded-xl py-3.5 font-bold text-sm">+ Create</button>
    </div>
    <div id="promoList" class="mt-5 space-y-2"></div>
  </div>

  <div class="glass rounded-[24px] p-6"><div class="flex justify-between"><h3 class="font-bold">👥 Users</h3><input id="searchUser" onkeyup="renderUsers()" placeholder="Search..." class="bg-white/[0.06] border border-white/10 rounded-full px-4 py-2 text-xs"></div><div id="usersTable" class="mt-4 space-y-2"></div></div>
  <div class="glass rounded-[24px] p-6 border border-yellow-500/20"><h3 class="font-bold">💸 Withdraws</h3><div id="wTable" class="mt-4 space-y-3"></div></div>
</div>

<script>
const DB_URL="https://taskup13-default-rtdb.firebaseio.com"; const ADMIN_PASS="Husnain123a786"; let allUsersData={};
async function dbGet(p){let r=await fetch(`${DB_URL}/${p}.json`);return await r.json();}
async function dbPatch(p,d){await fetch(`${DB_URL}/${p}.json`,{method:'PATCH',body:JSON.stringify(d)});}
async function dbDelete(p){await fetch(`${DB_URL}/${p}.json`,{method:'DELETE'});}
async function dbSet(p,d){await fetch(`${DB_URL}/${p}.json`,{method:'PUT',body:JSON.stringify(d)});}
function login(){if(document.getElementById('pass').value===ADMIN_PASS){document.getElementById('lock').style.display='none';document.getElementById('panel').style.display='block';loadAll();loadTasks();loadPromos();}else alert("Wrong!");}
async function loadAll(){let users=await dbGet(`users`);allUsersData=users||{};document.getElementById('totalUsers').innerText=users?Object.keys(users).length:0;renderUsers();let w=await dbGet(`withdraws`);document.getElementById('totalW').innerText=w?Object.keys(w).length:0;let html="";if(!w)html="<p class='text-center py-6 text-white/30'>No pending</p>";else{Object.values(w).reverse().forEach(req=>{html+=`<div class="bg-white/[0.04] border border-white/10 rounded-2xl p-4 flex flex-col md:flex-row justify-between gap-3"><div><b>${req.user}</b> - <span class="text-[#00FF88] font-bold">Rs ${req.amount}</span><br><span class="text-xs bg-white/10 px-2 py-1 rounded-full">${req.account}</span></div><div class="flex gap-2"><button onclick="approveW('${req.id}')" class="bg-[#00FF88]/20 text-[#00FF88] px-4 py-2 rounded-full text-xs font-bold">Approve</button><button onclick="rejectW('${req.id}')" class="bg-[#FF3B30]/20 text-[#FF3B30] px-4 py-2 rounded-full text-xs">Reject</button></div></div>`;});}document.getElementById('wTable').innerHTML=html;let paid=await dbGet(`total_paid`);document.getElementById('totalPaid').innerText=paid||0;}
function renderUsers(){let search=(document.getElementById('searchUser').value||"").toLowerCase();let html="";for(let u in allUsersData){if(search&&!u.toLowerCase().includes(search))continue;html+=`<div class="bg-white/[0.04] border border-white/10 rounded-xl p-3 flex justify-between items-center"><div><b>${u}</b> - Rs ${allUsersData[u].balance} | Refs ${allUsersData[u].refs}</div><div class="flex gap-1"><button onclick="editBal('${u}')" class="bg-white/10 px-3 py-1 rounded-full text-xs">Bal</button><button onclick="deleteUser('${u}')" class="bg-red-500/20 text-red-400 px-3 py-1 rounded-full text-xs">Del</button></div></div>`;}document.getElementById('usersTable').innerHTML=html;}

// ===== TASK MANAGER WITH PRICE CHANGE =====
async function createTask(){
  let name=document.getElementById('taskName').value.trim();
  let reward=parseInt(document.getElementById('taskReward').value);
  let link=document.getElementById('taskLink').value.trim();
  let icon=document.getElementById('taskIcon').value.trim()||"🔥";
  if(!name||!reward) return alert("Name & Price likho!");
  let id="task_"+Date.now();
  await dbSet(`tasks/${id}`, {id:id, name:name, reward:reward, link:link, icon:icon, active:true, createdAt:new Date().toLocaleString()});
  alert(`✅ Task "${name}" Rs ${reward} added!`);
  document.getElementById('taskName').value="";document.getElementById('taskReward').value="";document.getElementById('taskLink').value="";document.getElementById('taskIcon').value="";
  loadTasks();
}

async function loadTasks(){
  let tasks=await dbGet(`tasks`);
  let el=document.getElementById('taskList');
  document.getElementById('totalTasks').innerText=tasks?Object.keys(tasks).length:0;
  if(!tasks){el.innerHTML="<p class='text-white/30 text-sm bg-white/[0.02] border border-dashed border-white/10 rounded-xl p-6 text-center'>No tasks yet. User app khulne pe 4 default tasks auto ban jayenge. Aap yahan se price change kar sakte ho.</p>";return;}
  let html="";
  for(let key in tasks){
    let t=tasks[key];
    html+=`
    <div class="bg-[#00D2FF]/[0.06] border ${t.active?'border-[#00D2FF]/20':'border-red-500/20'} rounded-2xl p-4">
      <div class="flex flex-col lg:flex-row justify-between gap-4">
        <div class="flex gap-3 items-start min-w-0 flex-1">
          <div class="w-11 h-11 bg-white/10 rounded-xl flex items-center justify-center text-lg shrink-0">${t.icon}</div>
          <div class="min-w-0 flex-1">
            <p class="font-bold text-[14px] truncate">${t.name}</p>
            <p class="text-[11px] text-white/40 mt-1 truncate"><span class="text-[#00D2FF]">${t.link||'No link'}</span> • ${t.createdAt||''}</p>
            <div class="flex items-center gap-2 mt-2">
              <span class="text-[10px] bg-black/30 border border-white/10 px-2.5 py-1 rounded-full">ID: ${t.id.slice(0,12)}...</span>
              <span class="text-[10px] px-2.5 py-1 rounded-full ${t.active?'bg-[#00FF88]/15 text-[#00FF88] border border-[#00FF88]/20':'bg-red-500/15 text-red-400 border border-red-500/20'}">${t.active?'● ACTIVE':'● DISABLED'}</span>
            </div>
          </div>
        </div>

        <div class="flex flex-col sm:flex-row items-stretch sm:items-center gap-2 lg:w-[420px]">
          <!-- PRICE EDITOR -->
          <div class="flex items-center gap-2 bg-black/30 border border-[#00FF88]/20 rounded-xl px-3 py-2 flex-1">
            <span class="text-[#00FF88] text-xs font-bold">Rs</span>
            <input id="price_${key}" type="number" value="${t.reward}" class="bg-transparent w-full outline-none text-white font-bold text-[15px]">
            <button onclick="updatePrice('${key}')" class="bg-[#00FF88]/20 text-[#00FF88] border border-[#00FF88]/30 px-3 py-1.5 rounded-full text-[11px] font-bold hover:bg-[#00FF88]/30 shrink-0">Save Price</button>
          </div>

          <div class="flex gap-1.5">
            <button onclick="editTaskFull('${key}')" class="bg-white/10 hover:bg-white/15 border border-white/10 px-3 py-2.5 rounded-xl text-xs font-bold">✏️ Edit</button>
            <button onclick="toggleTask('${key}')" class="bg-yellow-500/15 hover:bg-yellow-500/25 text-yellow-400 border border-yellow-500/20 px-3 py-2.5 rounded-xl text-xs font-bold">${t.active?'Off':'On'}</button>
            <button onclick="deleteTask('${key}')" class="bg-red-500/15 hover:bg-red-500/25 text-red-400 border border-red-500/20 px-3 py-2.5 rounded-xl text-xs font-bold">🗑️</button>
          </div>
        </div>
      </div>
    </div>`;
  }
  el.innerHTML=html;
}

async function updatePrice(id){
  let newPrice = document.getElementById(`price_${id}`).value;
  if(!newPrice || newPrice < 1) return alert("Sahi price likho!");
  newPrice = parseInt(newPrice);
  await dbPatch(`tasks/${id}`, {reward:newPrice});
  alert(`✅ Price updated to Rs ${newPrice} - User app pe live change ho gaya!`);
  loadTasks();
}

async function toggleTask(id){let t=await dbGet(`tasks/${id}`);await dbPatch(`tasks/${id}`,{active:!t.active});loadTasks();}
async function deleteTask(id){if(confirm("Delete task? User app se gayab ho jayega!")){await dbDelete(`tasks/${id}`);loadTasks();}}
async function editTaskFull(id){
  let t=await dbGet(`tasks/${id}`);
  let name=prompt("Edit Task Name:", t.name); if(name===null) return;
  let reward=prompt("Edit Price / Reward Rs:", t.reward); if(reward===null) return;
  let link=prompt("Edit Link (https://...):", t.link); if(link===null) return;
  let icon=prompt("Edit Icon emoji (✈️ 📸 ▶️ 🎁):", t.icon); if(icon===null) return;
  await dbPatch(`tasks/${id}`, {name:name||t.name, reward:parseInt(reward)||t.reward, link:link, icon:icon||t.icon});
  alert("✅ Task Updated!");
  loadTasks();
}

async function createPromo(){let code=document.getElementById('promoCode').value.trim().toUpperCase();let reward=parseInt(document.getElementById('promoReward').value);let max=parseInt(document.getElementById('promoMax').value)||9999;if(!code||!reward)return alert("Code & Reward!");await dbSet(`promoCodes/${code}`,{reward:reward,active:true,maxUses:max,usedCount:0,createdAt:new Date().toLocaleString()});alert(`${code} created`);loadPromos();}
async function loadPromos(){let promos=await dbGet(`promoCodes`);let el=document.getElementById('promoList');if(!promos){el.innerHTML="<p class='text-white/30 text-xs'>No custom codes</p>";return;}let html="";for(let c in promos){let p=promos[c];html+=`<div class="bg-white/5 p-3 rounded-xl flex justify-between items-center"><div><b class="text-[#FF3BD4]">${c}</b> - Rs ${p.reward} | ${p.usedCount||0}/${p.maxUses}</div><div class="flex gap-1"><button onclick="togglePromo('${c}')" class="bg-white/10 px-2 py-1 rounded-full text-xs">Toggle</button><button onclick="deletePromo('${c}')" class="bg-red-500/20 text-red-400 px-2 py-1 rounded-full text-xs">Del</button></div></div>`;}el.innerHTML=html;}
async function togglePromo(c){let p=await dbGet(`promoCodes/${c}`);await dbPatch(`promoCodes/${c}`,{active:!p.active});loadPromos();}
async function deletePromo(c){if(confirm(`Delete ${c}?`)){await dbDelete(`promoCodes/${c}`);loadPromos();}}
async function editBal(u){let amt=prompt("Add/Cut:");if(!amt)return;await dbPatch(`users/${u}`,{balance:allUsersData[u].balance+parseInt(amt)});loadAll();}
async function deleteUser(u){if(confirm(`Delete ${u}?`)){await dbDelete(`users/${u}`);loadAll();}}
async function approveW(id){let req=await dbGet(`withdraws/${id}`);await dbPatch(`my_withdraws/${req.user}/${id}`,{status:"Paid"});await dbDelete(`withdraws/${id}`);let total=await dbGet(`total_paid`)||0;await dbSet(`total_paid`,total+req.amount);loadAll();}
async function rejectW(id){let req=await dbGet(`withdraws/${id}`);let user=await dbGet(`users/${req.user}`);if(user)await dbPatch(`users/${req.user}`,{balance:user.balance+req.amount});await dbPatch(`my_withdraws/${req.user}/${id}`,{status:"Rejected"});await dbDelete(`withdraws/${id}`);loadAll();}
</script>
</body>
</html>
