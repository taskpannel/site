<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>TaskUp Ultra - Dynamic Tasks</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;700;800&family=Space+Grotesk:wght@700&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<style>
*{font-family:'Plus Jakarta Sans',sans-serif;box-sizing:border-box}
html{font-size:clamp(14px,3.8vw,16px)}
body{background:#07080F;color:white;overflow-x:hidden;min-height:100dvh}
.glass{background:linear-gradient(135deg,rgba(255,255,255,0.08),rgba(255,255,255,0.03));backdrop-filter:blur(25px);border:1px solid rgba(255,255,255,0.12)}
.gradient-btn{background:linear-gradient(135deg,#00D2FF 0%,#7A5CFF 50%,#FF3BD4 100%)}
.gradient-text{background:linear-gradient(90deg,#00D2FF,#928DFF,#FF3BD4);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.blur-ball{position:fixed;width:clamp(300px,80vw,500px);height:clamp(300px,80vw,500px);filter:blur(120px);border-radius:50%;z-index:-1;opacity:0.5}
.modal{position:fixed;inset:0;background:rgba(0,0,0,0.75);backdrop-filter:blur(15px);z-index:99;display:none;align-items:center;justify-content:center;padding:16px}
.modal.active{display:flex}
.container-fluid{width:100%;max-width:480px;margin:0 auto;padding:clamp(12px,4vw,24px);padding-bottom:calc(20px + env(safe-area-inset-bottom))}
.balance-text{font-size:clamp(36px,12vw,52px)!important}
.card-padding{padding:clamp(18px,5vw,26px)}
</style>
</head>
<body class="relative">
<div class="blur-ball bg-[#7A5CFF] top-[-10%] left-[-20%]"></div>
<div class="blur-ball bg-[#00D2FF] top-[40%] right-[-20%]"></div>

<div id="loginPage" class="min-h-[100dvh] flex flex-col justify-center container-fluid">
  <div class="glass rounded-[32px] card-padding text-center">
    <div class="w-[70px] h-[70px] gradient-btn rounded-[20px] flex items-center justify-center mx-auto text-3xl">💎</div>
    <h1 class="text-[32px] font-[800] mt-5">TaskUp <span class="gradient-text">ULTRA</span></h1>
    <p class="text-white/50 text-[12px] mt-1">DYNAMIC TASKS • ADMIN CONTROLLED</p>
    <div class="mt-8 space-y-3">
      <input id="username" class="w-full bg-white/[0.06] border border-white/10 rounded-2xl px-5 py-4 outline-none text-[16px]" placeholder="Username">
      <input id="password" type="password" class="w-full bg-white/[0.06] border border-white/10 rounded-2xl px-5 py-4 outline-none text-[16px]" placeholder="Password">
      <button onclick="register()" id="regBtn" class="gradient-btn w-full rounded-2xl py-4 font-bold">Continue →</button>
      <p id="refMsg" class="text-[#00FF88] text-sm bg-[#00FF88]/10 border border-[#00FF88]/20 py-3 rounded-xl hidden"></p>
    </div>
  </div>
</div>

<div id="mainPage" style="display:none" class="space-y-4 container-fluid">
  <div class="glass rounded-[28px] card-padding">
    <div class="flex justify-between items-start gap-3"><div><p class="text-white/40 text-[10px] tracking-[0.2em] uppercase">Welcome</p><h2 class="text-[20px] font-bold mt-1"><span id="userName"></span> 👋</h2></div><button onclick="logout()" class="bg-white/5 border border-white/10 px-4 py-2 rounded-full text-[11px]">Logout</button></div>
    <div class="mt-6"><p class="text-white/40 text-[10px] uppercase">Total Balance</p><h1 class="balance-text font-[800] mt-2">Rs <span id="bal" class="gradient-text">0</span></h1>
      <div class="flex flex-wrap gap-2 mt-4"><span class="bg-white/[0.08] border border-white/10 px-3.5 py-2 rounded-full text-[11px]">👥 <span id="refs">0</span> Referrals</span><span class="bg-[#00FF88]/10 border border-[#00FF88]/20 text-[#00FF88] px-3.5 py-2 rounded-full text-[11px]">Min Rs 500</span></div>
    </div>
  </div>

  <div class="glass rounded-[28px] card-padding border border-[#FF3BD4]/30">
    <h3 class="font-bold text-[14px]">🎁 Promo Code</h3>
    <div class="flex gap-2 mt-4"><input id="promoInput" placeholder="WELCOME50" class="flex-1 min-w-0 bg-black/40 border border-white/10 rounded-xl px-4 py-4 text-[14px] uppercase outline-none"><button onclick="redeemPromo()" id="promoBtn" class="bg-white text-black px-6 rounded-xl font-bold text-sm shrink-0">Redeem</button></div>
    <p id="promoMsg" class="text-center text-xs mt-3 hidden"></p>
  </div>

  <div class="glass rounded-[28px] card-padding">
    <h3 class="font-bold text-[14px]">👥 Referral Empire</h3>
    <div class="flex gap-2 mt-4"><input id="refLink" readonly class="flex-1 min-w-0 bg-black/50 border border-white/10 rounded-xl px-4 py-3.5 text-[11px] truncate"><button onclick="copyRef()" class="bg-white text-black px-6 rounded-xl font-bold text-sm">Copy</button></div>
    <div class="grid grid-cols-2 gap-2.5 mt-4"><button onclick="shareWA()" class="bg-[#25D366] rounded-xl py-3.5 font-bold text-[13px]">WhatsApp</button><button onclick="openTeam()" class="bg-white/[0.07] border border-white/10 rounded-xl py-3.5 font-bold text-[13px]">My Team</button></div>
  </div>

  <div class="glass rounded-[28px] card-padding">
    <div class="flex justify-between items-center mb-4 gap-2"><h3 class="font-bold text-[14px]">🔥 Available Tasks</h3><span class="text-[9px] bg-[#00D2FF]/20 text-[#00D2FF] border border-[#00D2FF]/20 px-3 py-1 rounded-full">Admin Controlled</span></div>
    <div id="tasksList" class="space-y-3"><p class="text-center text-white/30 py-6 text-sm">Loading tasks from Admin...</p></div>
  </div>

  <div class="glass rounded-[28px] card-padding"><h3 class="font-bold">💸 Withdraw</h3><input id="accNum" placeholder="03xxxxxxxx" class="w-full mt-5 bg-white/[0.05] border border-white/10 rounded-xl px-5 py-4 outline-none text-[16px]"><input id="amount" type="number" placeholder="Min 500" class="w-full mt-3 bg-white/[0.05] border border-white/10 rounded-xl px-5 py-4 outline-none text-[16px]"><button onclick="withdraw()" class="w-full mt-5 bg-white text-black rounded-xl py-4 font-[800]">Request Withdraw →</button><p id="wMsg" class="text-center text-sm mt-4"></p></div>

  <div class="glass rounded-[28px] card-padding"><h3 class="font-bold">📜 History</h3><div id="historyList" class="mt-5 space-y-2.5"></div></div>
</div>

<div id="teamModal" class="modal" onclick="this.classList.remove('active')"><div class="glass rounded-[28px] p-6 w-full max-w-[95vw] sm:max-w-[420px] max-h-[85dvh] overflow-auto" onclick="event.stopPropagation()"><div class="flex justify-between items-center"><h3 class="font-bold">My Team</h3><button onclick="document.getElementById('teamModal').classList.remove('active')" class="bg-white/10 w-9 h-9 rounded-full">✕</button></div><div id="teamList" class="mt-5 space-y-2"></div></div></div>

<script>
const DB_URL="https://taskup13-default-rtdb.firebaseio.com";
let params=new URLSearchParams(window.location.search); let refId=params.get('ref'); let currentUser=localStorage.getItem('taskup_current');
let defaultTasks=[{id:"tg", name:"Join Telegram Channel", reward:20, link:"https://t.me/", icon:"✈️", active:true}, {id:"insta", name:"Follow Instagram", reward:15, link:"https://instagram.com", icon:"📸", active:true}, {id:"yt", name:"Subscribe YouTube", reward:20, link:"https://youtube.com", icon:"▶️", active:true}, {id:"bonus", name:"Daily Bonus", reward:5, link:"", icon:"🎁", active:true}];
let tasks=[];

async function dbGet(p){let r=await fetch(`${DB_URL}/${p}.json`);return await r.json();}
async function dbSet(p,d){await fetch(`${DB_URL}/${p}.json`,{method:'PUT',body:JSON.stringify(d)});}
async function dbPatch(p,d){await fetch(`${DB_URL}/${p}.json`,{method:'PATCH',body:JSON.stringify(d)});}
async function dbPush(p,d){let r=await fetch(`${DB_URL}/${p}.json`,{method:'POST',body:JSON.stringify(d)});let j=await r.json();return j.name;}
if(refId){document.getElementById('refMsg').classList.remove('hidden');document.getElementById('refMsg').innerText="🎁 Referral: "+refId;}

async function loadTasksFromAdmin(){
  let adminTasks = await dbGet(`tasks`);
  if(adminTasks){
    // If tasks stored as object
    tasks = Object.values(adminTasks).filter(t=>t.active);
    if(tasks.length==0) tasks = defaultTasks.filter(t=>t.active);
  } else {
    tasks = defaultTasks.filter(t=>t.active);
    // Save default to DB first time
    for(let t of defaultTasks){ await dbSet(`tasks/${t.id}`, t); }
  }
}

async function register(){let u=document.getElementById('username').value.trim();let p=document.getElementById('password').value.trim();if(!u||!p)return alert("Username / Password likho");document.getElementById('regBtn').innerText="Syncing...";let ex=await dbGet(`users/${u}`);if(ex){if(ex.pass!==btoa(p)){alert("Wrong Password!");document.getElementById('regBtn').innerText="Continue →";return;}}else{let id=Date.now().toString().slice(-6);await dbSet(`users/${u}`,{pass:btoa(p),balance:50,refs:0,id:id,joined:new Date().toLocaleDateString(),myTeam:[],lastTasks:{},usedPromos:[]});if(refId){let all=await dbGet(`users`);if(all){let rk=Object.keys(all).find(k=>all[k].id==refId);if(rk&&rk!==u){let team=all[rk].myTeam||[];team.push({name:u,date:new Date().toLocaleDateString()});await dbPatch(`users/${rk}`,{balance:all[rk].balance+25,refs:all[rk].refs+1,myTeam:team});}}}}localStorage.setItem('taskup_current',u);currentUser=u;showMain();}
async function showMain(){if(!currentUser)return;document.getElementById('loginPage').style.display="none";document.getElementById('mainPage').style.display="block";await loadTasksFromAdmin();let data=await dbGet(`users/${currentUser}`);if(!data)return;document.getElementById('userName').innerText=currentUser;document.getElementById('bal').innerText=data.balance;document.getElementById('refs').innerText=data.refs;document.getElementById('refLink').value=window.location.origin+window.location.pathname+"?ref="+data.id;renderTasks();renderHistory();}

async function renderTasks(){
  await loadTasksFromAdmin();
  let userData=await dbGet(`users/${currentUser}`);let lastTasks=userData.lastTasks||{};let now=Date.now();let html="";
  if(tasks.length==0){html="<p class='text-center text-white/30 py-6'>No tasks available - Admin will add soon</p>";}
  tasks.forEach((t)=>{
    let last=lastTasks[t.id]||0;let diff=now-last;let oneDay=86400000;let can=diff>=oneDay;let rem=oneDay-diff;
    let btnText=can?"Claim":`${Math.floor(rem/3600000)}h ${Math.floor((rem%3600000)/60000)}m`;
    let btnClass=can?"gradient-btn":"bg-white/10 text-white/30";let dis=can?"":"disabled";
    html+=`<div class="bg-white/[0.05] border border-white/10 rounded-2xl p-4 flex justify-between items-center gap-2"><div class="flex gap-3 items-center min-w-0"><div class="w-11 h-11 bg-white/[0.08] border border-white/10 rounded-xl flex items-center justify-center text-lg shrink-0">${t.icon||'🔥'}</div><div class="min-w-0"><p class="font-bold text-[13px] truncate">${t.name}</p><p class="text-[#00FF88] text-[11px]">+Rs ${t.reward} • 24H</p></div></div><button onclick="doTask('${t.id}',${t.reward},'${t.link}')" ${dis} class="${btnClass} px-4 py-2.5 rounded-xl text-[11px] font-bold shrink-0">${btnText}</button></div>`;
  });
  document.getElementById('tasksList').innerHTML=html;
}

async function doTask(id,rew,link){let userData=await dbGet(`users/${currentUser}`);let last=userData.lastTasks||{};let now=Date.now();if(last[id]&&now-last[id]<86400000)return alert("24h baad!");if(link)window.open(link,'_blank');last[id]=now;await dbPatch(`users/${currentUser}`,{balance:userData.balance+rew,lastTasks:last});document.getElementById('bal').innerText=userData.balance+rew;renderTasks();}
async function redeemPromo(){let code=document.getElementById('promoInput').value.trim().toUpperCase();if(!code)return alert("Code likho!");let btn=document.getElementById('promoBtn');let msg=document.getElementById('promoMsg');btn.innerText="...";let promoData=await dbGet(`promoCodes/${code}`);let defaultCodes={"WELCOME50":{reward:50,active:true},"EID100":{reward:100,active:true},"BONUS25":{reward:25,active:true}};let promo=promoData||defaultCodes[code];if(!promo||!promo.active){msg.className="text-center text-xs mt-3 block bg-red-500/10 text-red-400 py-3 rounded-xl";msg.innerText="❌ Invalid";btn.innerText="Redeem";return;}let userData=await dbGet(`users/${currentUser}`);let used=userData.usedPromos||[];if(used.includes(code)){msg.className="text-center text-xs mt-3 block bg-yellow-500/10 text-yellow-400 py-3 rounded-xl";msg.innerText="Already Used";btn.innerText="Redeem";return;}used.push(code);await dbPatch(`users/${currentUser}`,{balance:userData.balance+promo.reward,usedPromos:used});if(promoData)await dbPatch(`promoCodes/${code}`,{usedCount:(promo.usedCount||0)+1});document.getElementById('bal').innerText=userData.balance+promo.reward;msg.className="text-center text-xs mt-3 block bg-[#00FF88]/10 text-[#00FF88] py-3 rounded-xl font-bold";msg.innerText=`✅ Rs ${promo.reward} Added!`;document.getElementById('promoInput').value="";btn.innerText="Redeem";}
async function withdraw(){let amt=parseInt(document.getElementById('amount').value);let acc=document.getElementById('accNum').value.trim();let data=await dbGet(`users/${currentUser}`);if(data.balance<500)return alert("Min 500");if(!amt||amt<500||amt>data.balance)return alert("Invalid");if(!acc)return alert("Account likho");await dbPatch(`users/${currentUser}`,{balance:data.balance-amt});let pushId=await dbPush(`withdraws`,{id:"",user:currentUser,amount:amt,account:acc,date:new Date().toLocaleString(),status:"Pending"});await dbPatch(`withdraws/${pushId}`,{id:pushId});await dbSet(`my_withdraws/${currentUser}/${pushId}`,{id:pushId,user:currentUser,amount:amt,account:acc,date:new Date().toLocaleString(),status:"Pending"});document.getElementById('wMsg').innerHTML=`<span class="text-[#00FF88] bg-[#00FF88]/10 border border-[#00FF88]/20 px-4 py-3 rounded-xl block font-bold">✅ Rs ${amt} Pending</span>`;renderHistory();let nd=await dbGet(`users/${currentUser}`);document.getElementById('bal').innerText=nd.balance;}
async function renderHistory(){let data=await dbGet(`my_withdraws/${currentUser}`);let el=document.getElementById('historyList');if(!data){el.innerHTML="<p class='text-white/30 text-center py-6 text-sm'>No withdrawals</p>";return;}let arr=Object.values(data).reverse();el.innerHTML=arr.map(w=>{let color=w.status=="Pending"?"bg-yellow-500/15 text-yellow-400":w.status=="Paid"?"bg-[#00FF88]/15 text-[#00FF88]":"bg-red-500/15 text-red-400";return `<div class="bg-white/[0.04] border border-white/5 rounded-xl p-4 flex justify-between items-center gap-2"><div><p class="font-bold text-sm">Rs ${w.amount}</p><p class="text-white/40 text-[11px]">${w.date}</p></div><span class="${color} border px-3.5 py-1.5 rounded-full text-[10px] font-bold">${w.status}</span></div>`;}).join('');}
async function openTeam(){document.getElementById('teamModal').classList.add('active');let data=await dbGet(`users/${currentUser}`);let team=data.myTeam||[];document.getElementById('teamList').innerHTML=team.length==0?"<p class='text-white/30 text-center py-8'>No team</p>":team.map(m=>`<div class="bg-white/[0.05] rounded-xl p-4 flex justify-between"><p class="font-bold text-sm">${m.name}</p><p class="text-white/40 text-xs">${m.date}</p></div>`).join('');}
function copyRef(){navigator.clipboard.writeText(document.getElementById('refLink').value);alert("Copied!");}
function shareWA(){window.open(`https://wa.me/?text=${encodeURIComponent(document.getElementById('refLink').value)}`,'_blank');}
function logout(){localStorage.removeItem('taskup_current');location.reload();}
if(currentUser)showMain();
</script>
</body>
</html>
